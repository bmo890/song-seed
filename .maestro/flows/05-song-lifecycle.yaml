# Full sketch lifecycle in one self-cleaning flow: create → name → save → verify on
# the sketch page → back to collection → verify in list → long-press to select →
# Delete → confirm → verify it's gone. Leaves no residue, so it's safe to re-run.
# Exercises: collection "…" menu, addIdea, the New sketch sheet, title input, save,
# sketch page render, sketch→collection back, list render, selection mode,
# destructive confirm. ("New Song" is now "New sketch" — terminology law.)
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-new-song"
# "New sketch" sheet over the new sketch's page.
- extendedWaitUntil:
    visible: "New sketch"
    timeout: 10000
- assertVisible: "STAGE"
- tapOn:
    id: "song-title-input"
- eraseText: 40
- inputText: "Maestro Lifecycle Song"
- tapOn: "Save"
# The sketch page: title, the back chevron to its collection, and its four pages.
- extendedWaitUntil:
    notVisible: "New sketch"
    timeout: 10000
- assertVisible: "Maestro Lifecycle Song"
- assertVisible: "Back to Ideas"
- assertVisible: "Takes"
- assertVisible: "Lyrics"
# Back to the collection; the sketch appears in the list.
- tapOn:
    id: "song-header-back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
- assertVisible: ".*Maestro Lifecycle Song.*"
# Long-press to select, Delete → confirm; undo toast, then it's gone.
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Lifecycle Song"
