# Standalone Metronome controls: BPM up/down, meter change (Meter sheet), and the
# round start/stop key.
# Audible click is HUMAN (Sim audio), but every control's state change is checked.
# BPM assertions assume the tempo sits at the default 92 (the flow puts it back).
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-tool-metronome"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*Metronome.*"
    timeout: 10000
- assertVisible: ".*92 BPM.*"
# BPM up then down.
- tapOn: "Raise the tempo by one BPM"
- extendedWaitUntil:
    visible: ".*93 BPM.*"
    timeout: 5000
- tapOn: "Slow the tempo by one BPM"
- extendedWaitUntil:
    visible: ".*92 BPM.*"
    timeout: 5000
# Meter change 4/4 → 7/8 → back, inside the Meter sheet (2026-10-15: Meter
# and Sound are rows that open sheets; the meters are ink tabs). The chosen tab
# carries the selected state, and the beat row redraws one dot per beat.
- tapOn: "Meter"
- waitForAnimationToEnd
- tapOn: "7/8"
- extendedWaitUntil:
    visible:
      text: "7/8"
      selected: true
    timeout: 5000
- assertVisible: "Beat 7: .*"
- assertVisible: "CLICK ON"
- tapOn: "4/4"
- extendedWaitUntil:
    visible:
      text: "4/4"
      selected: true
    timeout: 5000
- assertVisible: "Beat 4: .*"
- assertNotVisible: "Beat 5: .*"
# Close the sheet on its scrim.
- tapOn:
    point: "50%,15%"
- waitForAnimationToEnd
# Start then stop the metronome (state toggle; the click itself is HUMAN).
- tapOn: "Start the metronome"
- extendedWaitUntil:
    visible: "Stop the metronome"
    timeout: 5000
- tapOn: "Stop the metronome"
- extendedWaitUntil:
    visible: "Start the metronome"
    timeout: 5000
