# Settings overview renders and its sub-views open + back out. Covers the Settings
# hub (the plan line and three doors, 2026-10-21) and its pages: Preferences
# (value rows + the merged Recording section), Data & storage, Help & about.
# Uses settings-card-* testIDs (slug of the row title) because the rows'
# composite a11y labels make text taps mis-target.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-settings"
- waitForAnimationToEnd
# Overview renders with every door.
- extendedWaitUntil:
    visible:
      id: "settings-card-preferences"
    timeout: 10000
- assertVisible: ".*Pro unlocked.*"
- assertVisible:
    id: "settings-card-data-storage"
- assertVisible:
    id: "settings-card-help-about"
# --- Preferences: value rows, then Recording ---
- tapOn:
    id: "settings-card-preferences"
- extendedWaitUntil:
    visible: "Open to.*"
    timeout: 10000
- assertVisible: "RECORDING"
- assertVisible:
    id: "settings-card-bluetooth-calibration"
# A value row opens its picker and closes on a second tap.
- tapOn: "Name suggestions.*"
- assertVisible: "English"
- tapOn: "Name suggestions.*"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-card-preferences"
    timeout: 10000
# --- Data & storage: backup, share, storage ---
- tapOn:
    id: "settings-card-data-storage"
- extendedWaitUntil:
    visible: "BACKUP"
    timeout: 10000
- assertVisible: "Reminder.*"
- assertVisible:
    id: "settings-card-sent-links"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-card-preferences"
    timeout: 10000
