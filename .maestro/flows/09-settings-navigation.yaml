# Settings overview renders and its sub-views open + back out. Covers the Settings
# hub (rows on paper, one row per area) and three representative detail pages —
# General (startup), Recording & audio, Data & storage — the ones most likely to
# break after a Settings IA refactor. Uses settings-card-* testIDs (slug of the
# row title) because the rows' composite a11y labels make text taps mis-target.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-settings"
- waitForAnimationToEnd
# Overview renders with every area row.
- extendedWaitUntil:
    visible:
      id: "settings-card-general"
    timeout: 10000
- assertVisible:
    id: "settings-card-account-pro"
- assertVisible:
    id: "settings-card-recording-audio"
- assertVisible:
    id: "settings-card-data-storage"
- assertVisible:
    id: "settings-card-help-about"
# --- General: language, startup, interaction ---
- tapOn:
    id: "settings-card-general"
- extendedWaitUntil:
    visible: "STARTUP"
    timeout: 10000
- assertVisible: "Open to"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-card-general"
    timeout: 10000
# --- Recording & audio: naming + devices ---
- tapOn:
    id: "settings-card-recording-audio"
- extendedWaitUntil:
    visible: "DEVICES"
    timeout: 10000
- assertVisible:
    id: "settings-card-bluetooth-calibration"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-card-general"
    timeout: 10000
# --- Data & storage: safety copy + backup reminder ---
- tapOn:
    id: "settings-card-data-storage"
- extendedWaitUntil:
    visible: "SAFETY COPY"
    timeout: 10000
- assertVisible: "BACKUP REMINDER"
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "settings-card-general"
    timeout: 10000
