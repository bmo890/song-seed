# Global (library-wide) search returns results. Create a findable sketch, open the
# drawer's Search (the glyph beside the SongNook mark), type a query, and confirm
# the sketch shows in the results, grouped under its kind with a match count. Then
# relaunch and delete the sketch to stay self-cleaning. Exercises the global
# search index/field and result rendering — distinct from in-collection search (10).
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- runFlow:
    file: ../subflows/new-sketch.yaml
    env:
      TITLE: "Maestro Global Find"
- extendedWaitUntil:
    visible: ".*Maestro Global Find.*"
    timeout: 10000
# Open the global Search from the drawer and query for it.
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "global-search"
- extendedWaitUntil:
    visible: "SEARCH LOOKS INSIDE"
    timeout: 10000
- tapOn:
    id: "global-search"
- inputText: "Global Find"
- extendedWaitUntil:
    visible: ".*Maestro Global Find.*"
    timeout: 8000
- assertVisible: "\\d+ match(es)?"
- assertVisible: "SONGS"
- assertVisible: ".*Open in Ideas.*"
# Clean up: relaunch, reopen the collection, delete the sketch.
- runFlow: ../subflows/open-ideas.yaml
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Global Find"
