# Lyric Pad page editing + autosave. Opens the pad's index (a place), adds a New
# page, types a line, backs out to the index and confirms the line autosaved into
# the page's preview, reopens the page, then deletes it through the editor's "…"
# menu (Text direction / Pin / Delete live there now) → confirm. Self-cleaning.
# Exercises the notepad editor text input, autosave, the index preview, and the
# page "…" menu.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-lyric-pad"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Lyric Pad"
    timeout: 10000
# New page (the place header's single right glyph).
- tapOn: "New page"
- extendedWaitUntil:
    visible: "Word finder"
    timeout: 10000
# Focus the empty body and type a line, then dismiss the keyboard via the date line.
- tapOn: ".*Start writing.*"
- inputText: "Maestro lyric line"
- tapOn: "\\d+ [A-Z]{3} \\d{4}"
- assertVisible: ".*Maestro lyric line.*"
# Back to the index: the autosaved line shows in the page's preview.
- tapOn: ".*Lyric Pad"
- extendedWaitUntil:
    visible: ".*Maestro lyric line.*"
    timeout: 10000
- assertVisible: "New page"
# Reopen the page — the line is still there.
- tapOn: ".*Maestro lyric line.*"
- extendedWaitUntil:
    visible: "Word finder"
    timeout: 10000
- assertVisible: ".*Maestro lyric line.*"
# Clean up: "…" → Delete → confirm; back on the index, the page is gone.
- tapOn: "More"
- extendedWaitUntil:
    visible: "Text direction"
    timeout: 5000
- assertVisible: "Pin"
- tapOn: "Delete"
- extendedWaitUntil:
    visible: "Delete page?"
    timeout: 5000
- tapOn:
    id: "dialog-btn-delete"
- extendedWaitUntil:
    visible: "New page"
    timeout: 10000
- assertNotVisible: ".*Maestro lyric line.*"
