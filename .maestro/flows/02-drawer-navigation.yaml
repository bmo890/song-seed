# Drawer navigation: Lyric Pad, Metronome and Settings each open from the side
# menu and render. Relaunches between destinations so every drawer-open starts
# from a known screen. The drawer opens via the `header-menu` testID; rows are
# targeted by their testIDs (`nav-row-<label>` for places, `nav-tool-<route>` for
# the three instruments in the tool tray above Settings). A backup-reminder
# dialog can appear on launch — open-library dismisses it.
appId: com.bmostudio.songnook.dev
---
# --- Lyric Pad (a place: large Lora title) ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-lyric-pad"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Lyric Pad"
    timeout: 10000
- assertVisible: "New page"

# --- Metronome (a tool, from the tool tray) ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-tool-metronome"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ".*\\d+ BPM.*"
    timeout: 10000
- assertVisible: "Start the metronome"

# --- Settings (rows on paper) ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-settings"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "settings-card-general"
    timeout: 10000
- assertVisible:
    id: "settings-card-account-pro"
