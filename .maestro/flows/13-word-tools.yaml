# Word tools (Lyric Spark). Lyric Spark is its own page now (drawer tool tray →
# Lyric Spark), no longer a button on the Lyric Pad index. Opens it, opens the
# "New spark" sheet, and verifies it offers all three tools. Then opens each tool
# to confirm it navigates and renders, backing out each time (returning closes
# the sheet, so it's re-opened between tools). Catches crashes in the spark entry
# and the tool screens. Opening a tool without saving leaves nothing behind.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-tool-sparks"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "lyrics-spark-open"
    timeout: 10000
# --- Word Ladder ---
- tapOn:
    id: "lyrics-spark-open"
- extendedWaitUntil:
    visible: "New spark"
    timeout: 5000
- assertVisible: ".*Word Ladder.*"
- assertVisible: ".*Cut-Up.*"
- assertVisible: ".*Borrowed Words.*"
- tapOn: ".*Word Ladder.*"
- extendedWaitUntil:
    visible: ".*JOB / ROLE.*"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "lyrics-spark-open"
    timeout: 10000
# --- Cut-Up ---
- tapOn:
    id: "lyrics-spark-open"
- extendedWaitUntil:
    visible: "New spark"
    timeout: 5000
- tapOn: ".*Cut-Up.*"
- extendedWaitUntil:
    visible: ".*YOUR STARTING LYRIC.*"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "lyrics-spark-open"
    timeout: 10000
# --- Magpie (opens a real book — needs a network fetch; verify the screen appears) ---
- tapOn:
    id: "lyrics-spark-open"
- extendedWaitUntil:
    visible: "New spark"
    timeout: 5000
- tapOn: ".*Borrowed Words.*"
- extendedWaitUntil:
    visible: ".*Borrowed Words.*|.*Finding a book.*|.*New book.*|.*needs a connection.*"
    timeout: 15000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "lyrics-spark-open"
    timeout: 10000
