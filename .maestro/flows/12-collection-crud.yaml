# Collection CRUD at the workspace level. Opens the workspace's Collections page
# (drawer → "Collections · n"), creates a collection via the add FAB + New
# collection name sheet (which auto-opens the new empty collection), confirms it
# opened, returns to the Collections page, long-presses its row into selection
# mode, and Delete → confirm it's gone. Self-cleaning. Exercises the Collections
# page, QuickNameModal, createCollection + auto-open, collection selection, and
# deletion.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-collections"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "COLLECTIONS"
    timeout: 10000
- runFlow: ../subflows/dismiss-logbox.yaml
# Create a collection — this drops us inside the new (empty) collection.
- tapOn:
    id: "workspace-add-collection"
- extendedWaitUntil:
    visible:
      id: "quickname-input"
    timeout: 10000
- tapOn:
    id: "quickname-input"
- inputText: "Maestro Collection"
- tapOn:
    id: "quickname-save"
- extendedWaitUntil:
    visible: "Maestro Collection"
    timeout: 10000
- assertVisible:
    id: "collection-search"
# Back to the Collections page to delete it.
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-collections"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "collection-card-maestro-collection"
    timeout: 10000
# Long-press the row (by testID → hits the Pressable, not a text child) to select,
# then Delete → confirm.
- longPressOn:
    id: "collection-card-maestro-collection"
- runFlow: ../subflows/dismiss-logbox.yaml
- extendedWaitUntil:
    visible: ".*Delete"
    timeout: 5000
- tapOn: ".*Delete"
- extendedWaitUntil:
    visible: ".*Delete.*collection.*|.*Delete selected.*|.*Delete.*Maestro.*"
    timeout: 5000
- tapOn:
    id: "dialog-btn-delete"
- extendedWaitUntil:
    notVisible:
      id: "collection-card-maestro-collection"
    timeout: 8000
