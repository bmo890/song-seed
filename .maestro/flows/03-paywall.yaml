# Paywall: the ProUpsellSheet renders its pitch, plans and CTA; the CTA shows the
# pre-billing inline notice; Restore shows the nothing-to-restore notice; "Not now"
# closes it. During the beta every Pro feature is unlocked, so Settings → Account &
# Pro no longer carries an "Upgrade to Pro" row — the sheet is reached through the
# __DEV__ "Pro sheet (dev)" item in the collection "…" menu, which opens the same
# sheet the real Pro gates open.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-dev-pro"
- extendedWaitUntil:
    visible: "Finish more songs"
    timeout: 10000
- assertVisible: "Practice tools"
- assertVisible: ".*Yearly.*"
- assertVisible: "Get Pro"
- waitForAnimationToEnd
- tapOn: "Get Pro"
# Billing stub → INLINE notice inside the sheet (not a dialog — a dialog can't
# present over the sheet's own Modal on iOS; see ProUpsellSheet).
- extendedWaitUntil:
    visible: ".*Purchases aren.t open yet.*"
    timeout: 10000
# Restore link → inline nothing-to-restore notice.
- tapOn: "Restore"
- extendedWaitUntil:
    visible: ".*Nothing to restore yet.*"
    timeout: 10000
# "Not now" closes the sheet; land back on the collection.
- tapOn: "Not now"
- extendedWaitUntil:
    notVisible: "Finish more songs"
    timeout: 10000
- assertVisible:
    id: "collection-search"
