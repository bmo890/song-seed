# Hide / reveal items. Create a sketch, hide it via selection mode (it disappears
# from the default list and a "Show all (N)" pill appears), reveal it with the
# pill, then delete it. Self-cleaning.
# Exercises the hide state + the reveal-hidden filter.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- runFlow:
    file: ../subflows/new-sketch.yaml
    env:
      TITLE: "Maestro Hide Song"
- extendedWaitUntil:
    visible: ".*Maestro Hide Song.*"
    timeout: 10000
# Select and Hide it.
- longPressOn: ".*Maestro Hide Song.*"
- extendedWaitUntil:
    visible:
      id: "selection-count"
    timeout: 5000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: ".*Hide"
- extendedWaitUntil:
    notVisible: ".*Maestro Hide Song.*"
    timeout: 8000
# A "Show all (N)" pill reveals hidden items.
- extendedWaitUntil:
    visible: "Show all \\(\\d+\\)"
    timeout: 8000
- tapOn: "Show all \\(\\d+\\)"
- extendedWaitUntil:
    visible: ".*Maestro Hide Song.*"
    timeout: 8000
# Clean up: delete it.
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Hide Song"
