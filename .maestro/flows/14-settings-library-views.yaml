# Deeper Settings → Data & storage views open and back out: Export an archive,
# Import an archive, Storage details. These are complex screens where a crash would be bad,
# so opening + rendering each is high-value. Deliberately does NOT tap Back up /
# Restore (those kick off real file operations / system sheets). The Export/Import
# rows live under SHARE & MOVE and Storage details under MAINTENANCE, at or below
# the fold — scroll to each.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-settings"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "settings-card-data-storage"
    timeout: 10000
- tapOn:
    id: "settings-card-data-storage"
- extendedWaitUntil:
    visible: "SAFETY COPY"
    timeout: 10000
# --- Export an archive ---
- scrollUntilVisible:
    element:
      id: "settings-card-export-an-archive"
    direction: DOWN
- tapOn:
    id: "settings-card-export-an-archive"
- extendedWaitUntil:
    visible: "Export archive"
    timeout: 10000
- assertVisible: "FORMAT"
- assertVisible: "SCOPE"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "SAFETY COPY"
    timeout: 10000
# --- Import an archive ---
- scrollUntilVisible:
    element:
      id: "settings-card-import-an-archive"
    direction: DOWN
- tapOn:
    id: "settings-card-import-an-archive"
- extendedWaitUntil:
    visible: "Import archive"
    timeout: 10000
- assertVisible: "Choose file"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "SAFETY COPY"
    timeout: 10000
# --- Storage details ---
- scrollUntilVisible:
    element:
      id: "settings-card-storage-details"
    direction: DOWN
- tapOn:
    id: "settings-card-storage-details"
- extendedWaitUntil:
    visible: "Storage details"
    timeout: 10000
- assertVisible: "Check integrity"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "SAFETY COPY"
    timeout: 10000
