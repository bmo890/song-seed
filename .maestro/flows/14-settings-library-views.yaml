# Deeper Settings → Data & storage views open and back out: Export an archive,
# Import an archive, Storage & repair. These are complex screens where a crash would be bad,
# so opening + rendering each is high-value. Deliberately does NOT tap Back up /
# Restore (those kick off real file operations / system sheets). Export/Import sit
# under SHARE and Storage & repair under STORAGE; scroll to each.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-settings"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "settings-card-data-storage"
    timeout: 10000
- tapOn:
    id: "settings-card-data-storage"
- extendedWaitUntil:
    visible: "BACKUP"
    timeout: 10000
# --- Export an archive ---
- scrollUntilVisible:
    element:
      id: "settings-card-export-an-archive"
    direction: DOWN
- tapOn:
    id: "settings-card-export-an-archive"
- extendedWaitUntil:
    visible: "Export archive"
    timeout: 10000
- assertVisible: "Format.*"
- assertVisible: "Include.*"
- assertVisible: "SCOPE"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "BACKUP"
    timeout: 10000
# --- Import an archive ---
- scrollUntilVisible:
    element:
      id: "settings-card-import-an-archive"
    direction: DOWN
- tapOn:
    id: "settings-card-import-an-archive"
- extendedWaitUntil:
    visible: "Import archive"
    timeout: 10000
- assertVisible: "Choose file"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "BACKUP"
    timeout: 10000
# --- Storage details ---
- scrollUntilVisible:
    element:
      id: "settings-card-storage-repair"
    direction: DOWN
- tapOn:
    id: "settings-card-storage-repair"
- extendedWaitUntil:
    visible: "REPAIR"
    timeout: 10000
- assertVisible:
    id: "settings-card-check-library"
- tapOn: "Back"
- extendedWaitUntil:
    visible: "BACKUP"
    timeout: 10000
