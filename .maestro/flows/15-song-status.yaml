# Sketch stage editing. The old SEED/SPROUT/STEM/SONG chips + "Completion %" readout
# became a single-select ink row of stages (Early / Rough / Close / Song) in the
# New sketch sheet; the chosen one carries the selected state. Verify the
# selection moves (Early → Song → Early), then save a sketch at Song, confirm the
# stage renders on the sketch page header and on its card in the list, and delete
# it. Self-cleaning. Exercises the stage row ↔ status binding and that the saved
# stage renders.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-new-song"
- extendedWaitUntil:
    visible: "New sketch"
    timeout: 10000
# A fresh draft starts at Early.
- assertVisible:
    text: "Early"
    selected: true
# Song takes the selection…
- tapOn: "Song"
- extendedWaitUntil:
    visible:
      text: "Song"
      selected: true
    timeout: 5000
- assertNotVisible:
    text: "Early"
    selected: true
# …and Early takes it back.
- tapOn: "Early"
- extendedWaitUntil:
    visible:
      text: "Early"
      selected: true
    timeout: 5000
- assertNotVisible:
    text: "Song"
    selected: true
# Name it, set it to Song, and save.
- tapOn:
    id: "song-title-input"
- eraseText: 40
- inputText: "Maestro Status Song"
- tapOn: "Song"
- tapOn: "Save"
- extendedWaitUntil:
    notVisible: "New sketch"
    timeout: 10000
# The sketch page header carries the stage ink.
- assertVisible: "Maestro Status Song"
- assertVisible: "SONG"
# Back to the list; the card shows the Song stage.
- tapOn:
    id: "song-header-back"
- extendedWaitUntil:
    visible: ".*Maestro Status Song, SONG.*"
    timeout: 10000
# Clean up.
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Status Song"
