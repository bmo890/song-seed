# Back never strands you. Pushed root-stack screens (Recording, sketch page) must
# always return to the collection you came from — never a dead-end, never a close.
# This is the iOS-observable half of the "back must not close the app" fix; the
# Android hardware-back half is a MANUAL device check (see docs/qa/CHECKLIST.md
# and RUN-LOG.md — the fix removed all BackHandler.exitApp() calls). The
# collection landmark is `collection-search` (the sketch page carries `fab-record`
# too, so that id can't prove we got back).
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
# Collection → Recording → back → collection (not stranded).
- tapOn:
    id: "fab-record"
- extendedWaitUntil:
    visible: "NEW CLIP"
    timeout: 10000
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
# Collection → create sketch → sketch page → back → collection (not stranded).
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-new-song"
- extendedWaitUntil:
    visible: "New sketch"
    timeout: 10000
- tapOn:
    id: "song-title-input"
- eraseText: 40
- inputText: "Maestro Back Test"
- tapOn: "Save"
- extendedWaitUntil:
    visible:
      id: "song-header-back"
    timeout: 10000
# Back is honest about where it goes: "Back to <origin collection>".
- assertVisible: "Back to Ideas"
- tapOn:
    id: "song-header-back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
# Reopen it and back out again — repeated back must stay stable (no loop, no exit).
- tapOn: ".*Maestro Back Test.*"
- extendedWaitUntil:
    visible:
      id: "song-header-back"
    timeout: 10000
- tapOn:
    id: "song-header-back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
# Clean up.
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Back Test"
