# Recording screen: opens from the collection's record FAB, renders its controls,
# the metronome toggles, its settings sheet opens/closes, and Back returns to the
# collection. Actual mic capture is HUMAN (Sim has no real mic) — this covers
# screen-open + control UI + navigation, which catches the common "recording
# screen crashes / controls missing / back is broken" regressions.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- tapOn:
    id: "fab-record"
- waitForAnimationToEnd
# Recording screen is up and ready (eyebrow is "NEW CLIP" since the clip rename).
- extendedWaitUntil:
    visible: "NEW CLIP"
    timeout: 10000
- assertVisible: "READY"
- assertVisible: "Discard take"
- assertVisible: "Save take"
# Metronome toggles on and off (a capture aid — no audio needed to verify the toggle).
- tapOn: "Turn metronome on"
- extendedWaitUntil:
    visible: "Turn metronome off"
    timeout: 5000
- tapOn: "Turn metronome off"
- extendedWaitUntil:
    visible: "Turn metronome on"
    timeout: 5000
# Metronome settings sheet opens; verify its content, then close it on the scrim.
- tapOn: "Metronome settings"
- extendedWaitUntil:
    visible: ".*\\d+ BPM.*"
    timeout: 5000
- tapOn:
    point: 50%,15%
- extendedWaitUntil:
    notVisible: ".*\\d+ BPM.*"
    timeout: 5000
# Leave the recorder via Back → returns to the collection.
- tapOn: "Back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
