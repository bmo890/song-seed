# In-collection search filtering. Creates a findable sketch, then: a matching query
# keeps it visible, a non-matching query filters it out, clearing restores it.
# Cleans up (deletes the sketch) so it's self-contained. Exercises the collection
# search field (the tonal fill) + live list filtering — a common feature that
# silently breaks when the filter predicate or the list data source changes.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-ideas.yaml
- runFlow:
    file: ../subflows/new-sketch.yaml
    env:
      TITLE: "Maestro Search Target"
- extendedWaitUntil:
    visible: ".*Maestro Search Target.*"
    timeout: 10000
# Matching query keeps it visible.
- tapOn:
    id: "collection-search"
- inputText: "Search Target"
- extendedWaitUntil:
    visible: ".*Maestro Search Target.*"
    timeout: 8000
# Non-matching query filters it out.
- tapOn:
    id: "collection-search"
- eraseText: 30
- inputText: "zzznomatchqq"
- extendedWaitUntil:
    notVisible: ".*Maestro Search Target.*"
    timeout: 8000
# Clearing the query restores it.
- tapOn:
    id: "collection-search"
- eraseText: 30
- extendedWaitUntil:
    visible: ".*Maestro Search Target.*"
    timeout: 8000
# Cleanup: delete the sketch (the subflow dismisses the search keyboard first,
# else the long-press doesn't register as a selection gesture).
- runFlow:
    file: ../subflows/delete-idea.yaml
    env:
      TITLE: "Maestro Search Target"
