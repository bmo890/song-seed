# Every drawer destination opens and renders. Relaunch per destination so each
# leg is independent (a crash on one doesn't cascade). Covers the places
# flow 02 didn't: Revisit, Activity, Compilations, Search. (Tuner has
# its own flow because it touches mic permission.) Catches nav-wiring regressions
# — the most common breakage after a navigation refactor. Uses the nav-row-<label>
# testIDs so a case-insensitive text match can't hit "Search your library" instead.
appId: com.bmostudio.songnook.dev
---
# --- Revisit ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-revisit"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Revisit"
    timeout: 10000
- assertVisible: "Customize Revisit"
# --- Activity ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "nav-row-activity"
- waitForAnimationToEnd
# Activity is a place now: Lora title over the year/month heat calendar.
- extendedWaitUntil:
    visible: "Activity"
    timeout: 10000
- assertVisible: "Customize Activity"
# --- Compilations ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
# "Compilations" is the curated hub (Playlists / Setlists / Songbooks), not the
# workspace collection list.
- tapOn:
    id: "nav-row-compilations"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Compilations"
    timeout: 10000
# Its three ink tabs.
- assertVisible: "Playlists"
- assertVisible: "Charts"
- assertVisible: "Setlists"
# --- Search (header search button, not a nav row) ---
- runFlow: ../subflows/open-library.yaml
- tapOn:
    id: "header-menu"
- waitForAnimationToEnd
- tapOn:
    id: "global-search"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "SEARCH LOOKS INSIDE"
    timeout: 10000
- assertVisible: "Search"
