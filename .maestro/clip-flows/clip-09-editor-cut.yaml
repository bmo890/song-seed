# Editor Cut/trim: mark a region, switch to Cut mode (removes the region), and
# save the trimmed copy. Distinct from Keep (each part becomes a clip): Remove cuts
# it. Verifies the trim produces a shorter clip. Self-cleaning. Requires push-dev-samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/open-library.yaml
- tapOn: ".*Ideas.*"
- extendedWaitUntil:
    visible:
      id: "fab-record"
    timeout: 15000
- runFlow: reset-clips.yaml
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-dev-samples"
- extendedWaitUntil:
    visible: ".*sample-01.*"
    timeout: 20000
- tapOn: ".*sample-01.*"
- extendedWaitUntil:
    visible: "More options"
    timeout: 10000
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Trim audio"
    timeout: 5000
- tapOn: "Trim audio"
- extendedWaitUntil:
    visible: ".*Add part.*"
    timeout: 10000
# Mark a region, then switch to Cut mode (region is removed / clip trimmed).
- tapOn: ".*Add part.*"
- extendedWaitUntil:
    visible: "Save clips"
    timeout: 8000
- tapOn: "Remove"
- extendedWaitUntil:
    visible: "Save copy"
    timeout: 5000
# Save the trim → the save sheet → its one key.
- tapOn: "Save copy"
- extendedWaitUntil:
    visible: "Save a copy"
    timeout: 8000
- tapOn: "Save"
# Back on the player — the trimmed clip (~33s, 5s removed from 38s) now exists.
- extendedWaitUntil:
    visible: ".*00:33.*"
    timeout: 10000
- runFlow:
    when:
      visible: "Minimize player"
    commands:
      - tapOn: "Minimize player"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "fab-record"
    timeout: 10000
# Clean up.
- longPressOn: ".*sample-0.*"
- extendedWaitUntil:
    visible: "Select all"
    timeout: 5000
- tapOn: "Select all"
- tapOn: ".*Delete"
- extendedWaitUntil:
    visible: ".*Delete selected items.*"
    timeout: 5000
- tapOn:
    id: "dialog-btn-delete"
- extendedWaitUntil:
    notVisible: ".*sample-0.*"
    timeout: 8000
