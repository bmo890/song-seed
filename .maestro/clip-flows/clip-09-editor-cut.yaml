# Editor cut: in the clip editor's Remove mode, mark a part and save a trimmed
# copy (Save copy → "Save a copy" sheet → Save). The copy is shorter by the
# removed part (38 s − ~4-5 s ≈ 33-34 s) and the original stays. Runs in the
# scratch "Maestro Clips" collection and deletes it at the end. Requires dev
# samples (sample-01 is the 38 s file).
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
- assertVisible: "sample-01, 0:38, .*"
- runFlow: ../subflows/clip-open-sample-01.yaml
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Trim audio"
    timeout: 5000
- tapOn: "Trim audio"
- extendedWaitUntil:
    visible: "Add part"
    timeout: 10000
# Remove mode, then mark a part to cut out.
- tapOn: "Remove"
- tapOn: "Add part"
- extendedWaitUntil:
    visible: "PARTS · 1"
    timeout: 8000
- assertVisible: "Save copy"
# Save the trim → the save sheet → its one key (the original is kept).
- tapOn: "Save copy"
- extendedWaitUntil:
    visible: "Save a copy"
    timeout: 8000
- assertVisible: ".*removed from sample-01"
- tapOn: "Save"
# Back on the player; close it. The trimmed copy sits beside the original.
- extendedWaitUntil:
    visible:
      id: "transport-close"
    timeout: 10000
- tapOn:
    id: "transport-close"
- extendedWaitUntil:
    notVisible:
      id: "transport-play"
    timeout: 10000
- assertVisible: "sample-01 v2, 0:3[34], .*"
- assertVisible: ".*sample-01, 0:38, .*"
- runFlow: ../subflows/clip-close-scratch.yaml
