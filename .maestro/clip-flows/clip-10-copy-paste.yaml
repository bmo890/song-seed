# Copy a clip to another collection via the copy/paste model. Selection "…" →
# Copy or move → Copy puts the clip on a clipboard ("1 to copy"); opening a second
# collection shows a "Paste here" bar that completes the copy after a confirm. The
# clip lands in the destination AND stays in the source. Verifies cross-collection
# organization. Creates + deletes a throwaway "Maestro Dest" collection and the
# scratch "Maestro Clips" collection, so it's self-cleaning. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
# Destination first (setup relaunches the app, which would drop a pending copy).
- runFlow: ../subflows/clip-new-dest.yaml
- assertVisible: "Nothing here yet"
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
# Select sample-01 → More → Copy, move, playlist → Copy.
- longPressOn: "sample-01, .*"
- extendedWaitUntil:
    visible:
      id: "selection-count"
    timeout: 5000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: ".*More"
- extendedWaitUntil:
    visible: "Copy, move, playlist"
    timeout: 5000
- tapOn: "Copy, move, playlist"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 5000
- tapOn: "Copy"
- extendedWaitUntil:
    visible: "1 to copy"
    timeout: 5000
- tapOn:
    id: "dialog-btn-ok"
# Open Maestro Dest and paste.
- runFlow:
    file: ../subflows/clip-goto-collection.yaml
    env:
      SLUG: "maestro-dest"
- extendedWaitUntil:
    visible: "Paste here"
    timeout: 10000
- assertVisible: "1 to copy"
- tapOn: "Paste here"
- extendedWaitUntil:
    visible: "Copy items here?"
    timeout: 5000
- tapOn:
    id: "dialog-btn-copy"
# The copied clip now appears in Maestro Dest; the paste bar is gone.
- extendedWaitUntil:
    visible: "sample-01, .*"
    timeout: 10000
- assertNotVisible: "Paste here"
# …and the original is still in the source.
- runFlow:
    file: ../subflows/clip-goto-collection.yaml
    env:
      SLUG: "maestro-clips"
- assertVisible: "sample-01, .*"
# Clean up both collections.
- runFlow:
    file: ../subflows/delete-collection.yaml
    env:
      SLUG: "maestro-dest"
- runFlow: ../subflows/clip-close-scratch.yaml
