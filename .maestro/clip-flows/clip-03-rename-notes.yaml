# Edit clip metadata: rename a clip and add notes via the selection "…" → Edit
# sheet (ClipNotesSheet), confirm the new title renders on the card and the notes
# persisted (reopen the sheet). Runs in the scratch "Maestro Clips" collection and
# deletes it at the end. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
# Select the clip → More → Edit → the title/notes sheet.
- longPressOn: "sample-01, .*"
- extendedWaitUntil:
    visible:
      id: "selection-count"
    timeout: 5000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: ".*More"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 5000
- tapOn: "Edit"
- extendedWaitUntil:
    visible:
      id: "clip-title-input"
    timeout: 10000
# Rename + add notes.
- tapOn:
    id: "clip-title-input"
- eraseText: 40
- inputText: "Renamed Clip"
- tapOn:
    id: "clip-notes-input"
- inputText: "maestro notes line"
# Sheet is keyboardAvoiding — Save stays reachable above the keyboard.
- tapOn: "Save"
# The renamed clip shows on the card (a typed name reads as a name).
- extendedWaitUntil:
    visible: "Renamed Clip, .*"
    timeout: 10000
- assertNotVisible: "sample-01, .*"
# The notes persisted: reopen the Edit sheet on the renamed clip.
- runFlow:
    when:
      visible:
        id: "selection-cancel"
    commands:
      - tapOn:
          id: "selection-cancel"
- longPressOn: "Renamed Clip, .*"
- extendedWaitUntil:
    visible:
      id: "selection-count"
    timeout: 5000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: ".*More"
- extendedWaitUntil:
    visible: "Edit"
    timeout: 5000
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "maestro notes line"
    timeout: 10000
- tapOn: "Cancel"
- runFlow: ../subflows/clip-close-scratch.yaml
