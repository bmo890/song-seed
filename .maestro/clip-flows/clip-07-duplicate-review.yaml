# Duplicate-import review. Import the samples, then import them AGAIN — the app
# detects the duplicates and shows the "Already imported" review, where the files
# you already have start unticked ("Include <name>"; ticking one flips it to
# "Exclude <name> from import"). Backing out with Cancel must add nothing (the
# collection count is unchanged, no second copy appears). Runs in the scratch
# "Maestro Clips" collection and deletes it at the end. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
# Remember the collection's count line ("N ideas · Edited today").
- copyTextFrom: "\\d+ ideas? .*"
# Second import of the same files → duplicate review.
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- tapOn:
    id: "collection-menu-dev-samples"
- extendedWaitUntil:
    visible: "ALREADY IN YOUR LIBRARY"
    timeout: 10000
- assertVisible: "Already imported"
# Duplicates start unticked; a tick toggles.
- assertVisible: "Include sample-01"
- tapOn: "Include sample-01"
- extendedWaitUntil:
    visible: "Exclude sample-01 from import"
    timeout: 5000
- tapOn: "Exclude sample-01 from import"
- extendedWaitUntil:
    visible: "Include sample-01"
    timeout: 5000
# Skip the duplicates — nothing new should be added.
- tapOn: "Cancel"
- extendedWaitUntil:
    notVisible: "ALREADY IN YOUR LIBRARY"
    timeout: 10000
- assertVisible:
    id: "collection-search"
# Same count as before (dedup worked), and no second sample-01.
- assertVisible: ${maestro.copiedText}
- assertNotVisible: ".*sample-01 \\(\\d+\\).*"
- runFlow: ../subflows/clip-close-scratch.yaml
