# Import real audio (dev pipeline) and play it. Verifies: the import pipeline
# creates clip cards with durations, tapping a clip opens the player sheet, the
# play/pause transport toggles, and the player's ✕ closes back to the collection.
# Runs in the scratch "Maestro Clips" collection and deletes it at the end.
# Requires dev samples in Documents/dev-samples (scripts/push-dev-samples.sh).
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
# Import the dev sample clips through the real pipeline.
- runFlow: ../subflows/clip-import-samples.yaml
# Open the first clip → the player sheet.
- runFlow: ../subflows/clip-open-sample-01.yaml
- assertVisible: "sample-01"
- assertVisible:
    id: "transport-close"
# Play → transport switches to Pause; pause → back to Play.
- assertVisible:
    id: "transport-play"
    text: "Play"
- tapOn:
    id: "transport-play"
- extendedWaitUntil:
    visible:
      id: "transport-play"
      text: "Pause"
    timeout: 8000
- tapOn:
    id: "transport-play"
- extendedWaitUntil:
    visible:
      id: "transport-play"
      text: "Play"
    timeout: 8000
# Close the player, back to the collection.
- tapOn:
    id: "transport-close"
- extendedWaitUntil:
    notVisible:
      id: "transport-play"
    timeout: 10000
- assertVisible:
    id: "collection-search"
# Clean up: delete the scratch collection with the imported clips.
- runFlow: ../subflows/clip-close-scratch.yaml
