# Open the clip editor on a real clip and make an edit. Verifies: the editor
# mounts on an imported clip (player "…" → Trim audio → "Edit clip"), "Add part"
# creates a part (the "Nothing marked yet" empty state clears, the PARTS count
# reads 1), and Back returns to the player without crashing. Runs in the scratch
# "Maestro Clips" collection and deletes it at the end. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
- runFlow: ../subflows/clip-open-sample-01.yaml
# Player "…" → Trim audio → the editor.
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Trim audio"
    timeout: 5000
- tapOn: "Trim audio"
- extendedWaitUntil:
    visible: "Edit clip"
    timeout: 10000
- assertVisible: "Nothing marked yet"
- assertVisible: "Keep"
- assertVisible: "Remove"
# Make an edit: add a part at the playhead — the empty state should clear.
- tapOn: "Add part"
- extendedWaitUntil:
    notVisible: "Nothing marked yet"
    timeout: 8000
- assertVisible: "PARTS · 1"
- assertVisible: "sample-01 v2, .*"
# Leave the editor (unsaved parts are dropped) → back on the player.
- tapOn: "Back to Maestro Clips"
- extendedWaitUntil:
    visible:
      id: "transport-close"
    timeout: 10000
- assertNotVisible: "Edit clip"
- tapOn:
    id: "transport-close"
- extendedWaitUntil:
    notVisible:
      id: "transport-play"
    timeout: 10000
- assertVisible: "sample-01, .*"
- runFlow: ../subflows/clip-close-scratch.yaml
