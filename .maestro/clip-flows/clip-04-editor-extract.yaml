# Editor extract: mark a part and save it as its own clip, confirming the
# extracted (short) clip is created. Exercises the editor's real output path
# (Keep → Add part → Save clips → the sheet's Save), not just mounting. Runs in
# the scratch "Maestro Clips" collection and deletes it at the end. Requires dev
# samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
- runFlow: ../subflows/clip-open-sample-01.yaml
# Open the editor on the clip.
- tapOn: "More options"
- extendedWaitUntil:
    visible: "Trim audio"
    timeout: 5000
- tapOn: "Trim audio"
- extendedWaitUntil:
    visible: "Add part"
    timeout: 10000
# Mark a part and save it as a new clip.
- tapOn: "Add part"
- extendedWaitUntil:
    visible: "PARTS · 1"
    timeout: 8000
- tapOn: "Save clips"
- extendedWaitUntil:
    visible: "Save 1 clip"
    timeout: 8000
- tapOn: "Save"
# The short extracted part (~4 s, "sample-01 v2") now exists as its own clip.
- extendedWaitUntil:
    visible: ".*00:0[3-5].*|.*0:0[3-5].*"
    timeout: 10000
- runFlow:
    when:
      visible:
        id: "transport-close"
    commands:
      - tapOn:
          id: "transport-close"
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
- assertVisible: ".*sample-01 v2.*0:0[3-5].*"
- runFlow: ../subflows/clip-close-scratch.yaml
