# Sketch import: import the samples as ONE sketch (an idea holding all the clips
# as takes) via the __DEV__ "Import as sketch (dev)" item, confirm the single
# sketch card appears (titled "Maestro Dev Song", or "… (2)" when the workspace
# already holds one), open it, and confirm the sketch page renders its takes. A
# different data shape from individual-clip import. Runs in the scratch "Maestro
# Clips" collection and deletes it at the end. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
# Import the samples as one sketch.
- tapOn:
    id: "collection-overflow"
- waitForAnimationToEnd
- assertVisible:
    id: "collection-menu-dev-song"
- tapOn:
    id: "collection-menu-dev-song"
- extendedWaitUntil:
    visible: "Maestro Dev Song( \\(\\d+\\))?, .*"
    timeout: 20000
# One sketch, not loose clips.
- assertVisible: "1 idea.*"
- assertNotVisible: "sample-01, .*"
# Open the sketch → its page with the takes.
- tapOn: "Maestro Dev Song( \\(\\d+\\))?, .*"
- extendedWaitUntil:
    visible:
      id: "song-header-back"
    timeout: 10000
- assertVisible: "Maestro Dev Song( \\(\\d+\\))?"
- assertVisible: ".*\\d+ takes.*"
- assertVisible: ".*sample-01.*"
# Back to the collection and clean up.
- tapOn:
    id: "song-header-back"
- extendedWaitUntil:
    visible:
      id: "collection-search"
    timeout: 10000
- runFlow: ../subflows/clip-close-scratch.yaml
