# Play all: collection "…" → Play all opens the queue player, which auto-plays
# the collection's clips back to back (transport reads Pause, the queue has a
# Next). Then pause and close. Runs in the scratch "Maestro Clips" collection and
# deletes it at the end. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
# Collection "…" → Play all.
- tapOn:
    id: "collection-overflow"
- extendedWaitUntil:
    visible: "Play all"
    timeout: 5000
- tapOn: "Play all"
# The queue player opens and auto-plays (transport shows Pause).
- extendedWaitUntil:
    visible:
      id: "transport-play"
      text: "Pause"
    timeout: 10000
- assertVisible:
    id: "transport-close"
- assertVisible: "Show queue"
# Stop and close.
- tapOn:
    id: "transport-play"
- extendedWaitUntil:
    visible:
      id: "transport-play"
      text: "Play"
    timeout: 8000
- tapOn:
    id: "transport-close"
- extendedWaitUntil:
    notVisible:
      id: "transport-play"
    timeout: 10000
- assertVisible:
    id: "collection-search"
- runFlow: ../subflows/clip-close-scratch.yaml
