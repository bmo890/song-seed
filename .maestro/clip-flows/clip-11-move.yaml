# Move a clip to another collection: selection "…" → Copy or move → Move puts it
# on the clipboard ("1 to move"); "Paste here" in a second collection completes
# the move after a confirm. The clip lands in the destination AND is removed from
# the source. Creates + deletes a throwaway "Maestro Dest" collection and the
# scratch "Maestro Clips" collection, so it's self-cleaning. Requires dev samples.
appId: com.bmostudio.songnook.dev
---
# Destination first (setup relaunches the app, which would drop a pending copy).
- runFlow: ../subflows/clip-new-dest.yaml
- assertVisible: "Nothing here yet"
- runFlow: ../subflows/clip-open-scratch.yaml
- runFlow: ../subflows/clip-import-samples.yaml
# Select sample-01 → More → Copy or move → Move.
- longPressOn: "sample-01, .*"
- extendedWaitUntil:
    visible:
      id: "selection-count"
    timeout: 5000
- runFlow: ../subflows/dismiss-logbox.yaml
- tapOn: ".*More"
- extendedWaitUntil:
    visible: "Copy or move"
    timeout: 5000
- tapOn: "Copy or move"
- extendedWaitUntil:
    visible: "Copy"
    timeout: 5000
- tapOn: "Move"
- extendedWaitUntil:
    visible: "1 to move"
    timeout: 5000
- tapOn:
    id: "dialog-btn-ok"
# Open Maestro Dest and paste (completes the move).
- runFlow:
    file: ../subflows/clip-goto-collection.yaml
    env:
      SLUG: "maestro-dest"
- extendedWaitUntil:
    visible: "Paste here"
    timeout: 10000
- assertVisible: "1 to move"
- tapOn: "Paste here"
- extendedWaitUntil:
    visible: "Move items here?"
    timeout: 5000
- tapOn:
    id: "dialog-btn-move"
# The moved clip now appears in Maestro Dest; the paste bar is gone.
- extendedWaitUntil:
    visible: "sample-01, .*"
    timeout: 10000
- assertNotVisible: "Paste here"
# …and it was MOVED out of the source (gone), while the others remain.
- runFlow:
    file: ../subflows/clip-goto-collection.yaml
    env:
      SLUG: "maestro-clips"
- assertVisible: "sample-02, .*"
- assertNotVisible: "sample-01, .*"
# Clean up both collections.
- runFlow:
    file: ../subflows/delete-collection.yaml
    env:
      SLUG: "maestro-dest"
- runFlow: ../subflows/clip-close-scratch.yaml
