name = "songnook-send"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

# Branded custom domains only (no workers.dev). The apex is the public face —
# landing + /privacy + /terms; send.* is the transfer service. Same Worker.
routes = [
  { pattern = "send.songnook.app", custom_domain = true },
  { pattern = "songnook.app", custom_domain = true },
]
workers_dev = false

# The pages' fonts (Lora, Plus Jakarta Sans; OFL) are served from public/ by the
# Workers asset server; paths with no file there fall through to the Worker.
[assets]
directory = "./public"

# ── Public, non-secret config (safe to commit) ───────────────────────────────
[vars]
# Canonical public origin. The mobile app and web page embed only this — it is
# NOT a secret. Universal-link association files (.well-known) target this host.
PUBLIC_ORIGIN = "https://send.songnook.app"
# v1 limits (see docs/product-plan/transfer-service-brief.md §9, settled).
MAX_TRANSFER_BYTES = "1073741824"   # 1 GB per transfer
MAX_ITEM_BYTES = "1073741824"       # 1 GB per file (a collection is one file)
EXPIRY_DAYS = "7"
# Unfinished drafts are not useful to recipients and are the main storage-abuse
# window, so sweep them sooner than finalized transfers.
DRAFT_EXPIRY_HOURS = "24"
# Anti-abuse: browser origins allowed to call the write API (the app sends no
# Origin and is allowed; PUBLIC_ORIGIN + localhost are always trusted).
ALLOWED_WEB_ORIGINS = ""
# Per-IP write rate limits for the KV FALLBACK (fixed 1-hour window) — only used
# when the ratelimit bindings below are absent (local dev).
RATE_CREATE_PER_HOUR = "30"
RATE_ITEMS_PER_HOUR = "300"
# Store links for the mobile-without-app install funnel.
# BETA (2026-10-11): the App Store listing (apps.apple.com/app/id6810435199) is a
# 404 until launch, so the iOS button points at the TestFlight public link for
# the "Beta Production" group. Swap back to the App Store URL at launch.
IOS_APP_STORE_URL = "https://testflight.apple.com/join/wY6azj3Z"
ANDROID_PACKAGE = "com.bmostudio.songnook"
# Universal / App Link association (.well-known). Apple Team ID is public by
# nature (it is in every AASA on the internet); the Android value is the SHA-256
# of the EAS upload key that signs the preview/production APKs. Once Play App
# Signing re-signs store installs, append Play's fingerprint here, comma-separated.
APPLE_TEAM_ID = "PMJJ7Q9UXD"
ANDROID_CERT_FINGERPRINTS = "9D:9F:2E:57:BE:EB:B8:EB:62:4E:D8:70:6A:49:E8:FC:0A:9F:A2:F6:E4:15:DE:59:9C:1E:CC:70:1D:B1:C8:D8"
# Abuse-report mailbox the /report/:id funnel points at (not a secret).
ABUSE_CONTACT_EMAIL = "bmostudio.dev@gmail.com"
# R2 account + bucket used to mint presigned URLs (bucket name is not a secret).
R2_ACCOUNT_ID = "350834456909bc6ec117efad478be829"
R2_BUCKET = "songnook-send"

# ── R2 binding: proxied ranged downloads use this (no credentials involved) ──
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "songnook-send"
preview_bucket_name = "songnook-send-preview"

# ── D1 binding: transfer + item metadata ────────────────────────────────────
[[d1_databases]]
binding = "DB"
database_name = "songnook_send"
database_id = "6c31073c-ee89-4d9d-b88c-3f307000935d"
migrations_dir = "migrations"

# ── Rate Limiting bindings: per-IP limits on create + upload (production) ────
# Atomic per colo (a KV counter is a racy read-modify-write — see lib/guard.ts).
# `period` may only be 10 or 60 seconds; the hourly vars above size the KV
# fallback only. Nothing to create: the bindings exist once deployed.
# `namespace_id` is an arbitrary integer, unique per binding within the account.
[[unsafe.bindings]]
name = "RATE_CREATE"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[[unsafe.bindings]]
name = "RATE_ITEMS"
type = "ratelimit"
namespace_id = "1002"
# Above MAX_ITEMS_PER_TRANSFER (200): the app registers a loose-files link one
# file at a time, so one legitimate send of short clips can need ~200 in a minute.
simple = { limit = 240, period = 60 }

# ── KV binding: rate-limit FALLBACK when the bindings above are absent ───────
# (local dev). Create with `wrangler kv namespace create RATE`, paste the id.
# With neither, rate limiting fails open.
[[kv_namespaces]]
binding = "RATE"
id = "89a03d6d2b0a42a5bc9112c87f5ff7dc"

# ── Nightly expiry sweep ─────────────────────────────────────────────────────
[triggers]
crons = ["0 3 * * *"]

# ── SECRETS (never committed — set via `wrangler secret put <NAME>`): ─────────
#   R2_ACCESS_KEY_ID       — R2 S3 API access key (for minting presigned PUT URLs)
#   R2_SECRET_ACCESS_KEY   — R2 S3 API secret
# Locally these live in `.dev.vars` (gitignored). See .dev.vars.example.
